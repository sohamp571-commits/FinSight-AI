# ==========================================================
# FinSight AI - Streamlit Configuration
# Sets sane defaults for local development. Theme colors here are
# the Streamlit-native base theme; app.py layers additional
# FinSight-specific styling on top via st.markdown/CSS.
# ==========================================================

[theme]
base = "light"
primaryColor = "#4F8BF9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#111111"
font = "sans serif"

[server]
headless = true
runOnSave = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
